<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Query Resolver System – Routing</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--primary-900);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
        }
        .router-loader {
            text-align: center;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="router-loader">
        <div class="spinner"></div>
        <p style="font-weight: 600; font-size: 1.1rem;">Loading Query Resolver...</p>
        <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 0.25rem;">Checking user authorization</p>
    </div>

    <script type="module">
        import { AuthService } from './js/auth.js';

        document.addEventListener('DOMContentLoaded', () => {
            const profile = AuthService.getCurrentProfile();
            if (!profile) {
                window.location.replace('login.html');
            } else if (profile.role === 'admin') {
                window.location.replace('admin/index.html');
            } else {
                window.location.replace('app/index.html');
            }
        });
    </script>
</body>
</html>
